name: Weekly Competitor Digest

on:
  schedule:
    # 每週一 UTC 01:00 = 台北 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:
    # 手動觸發（Demo 用）

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run digest script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/weekly_competitor_digest.py

      - name: Commit & push report
        run: |
          git config user.name "AI Workflow Bot"
          git config user.email "bot@ai-workflow.local"
          git add reports/
          git diff --staged --quiet || git commit -m "docs: weekly competitor digest $(date +%Y-W%W)"
          git push
